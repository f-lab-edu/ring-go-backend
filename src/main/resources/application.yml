server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
      enabled: true

spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
jwt:
  secret: your-256-bit-secret-key-should-be-very-long-and-secure
  access-token-validity: 3600000  # 1시간
  refresh-token-validity: 604800000  # 7일

# OAuth2 설정
oauth2:
  # 콜백 기본 URL
  callback-base-url: http://localhost:8080

  # 카카오 설정
  kakao:
    redirect-uri: /auth/oauth/callback/kakao
    authorization-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me

  # 네이버 설정
  naver:
    redirect-uri: /auth/oauth/callback/naver
    authorization-uri: https://nid.naver.com/oauth2.0/authorize
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me

  # 구글 설정
  google:
    redirect-uri: /auth/oauth/callback/google
    authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  # 애플 설정
  apple:
    redirect-uri: /auth/oauth/callback/apple
    authorization-uri: https://appleid.apple.com/auth/authorize
    token-uri: https://appleid.apple.com/auth/token
    user-info-uri: https://appleid.apple.com/auth/userinfo

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.data: DEBUG
    com.ringgo: DEBUG  # 애플리케이션 로그 레벨 설정
    com.ringgo.common.config.security: DEBUG  # 보안 관련 상세 로깅
    com.ringgo.common.config.security.jwt: DEBUG  # JWT 관련 상세 로깅
