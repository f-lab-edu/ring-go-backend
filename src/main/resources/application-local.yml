# ── application-local.yml (로컬 환경) ──
spring:
  config:
    activate:
      on-profile: local

  # ── 로컬 H2 데이터베이스 설정 ──
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:ringgo;MODE=MySQL;NON_KEYWORDS=USER}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-local.sql
      data-locations: classpath:db/data-local.sql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# ── 로컬 환경 Actuator 설정 ──
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - env
          - beans
          - configprops
          - loggers
          - httpexchanges
          - heapdump
          - threaddump
  endpoint:
    health:
      show-details: always
      show-components: always
