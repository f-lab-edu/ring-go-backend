# application-local.yml (로컬 환경 특화 설정만)
spring:
  config:
    activate:
      on-profile: local

  # 로컬 개발용 DB 설정
  datasource:
    url: jdbc:h2:mem:ringgo;MODE=MySQL;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-local.sql
      data-locations: classpath:db/data-local.sql

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# 로컬 환경 전용 Actuator (개발용 - 최대 개방)
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - env
          - beans
          - configprops
          - loggers
          - httpexchanges
          - heapdump
          - threaddump
  endpoint:
    health:
      show-details: always
      show-components: always
