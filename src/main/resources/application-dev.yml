# ── application-dev.yml (개발 서버) ──
spring:
  config:
    activate:
      on-profile: dev

  # ── 개발 MySQL 설정 ──
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-dev.sql
      data-locations: classpath:db/data-dev.sql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# ── 개발 서버 Actuator 설정 ──
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - env
          - beans
          - configprops
          - loggers
          - httpexchanges
  endpoint:
    health:
      show-details: always
      show-components: always

# ── 개발 서버 Swagger 설정 ──
swagger:
  description: "Development Server - Ring-Go"
