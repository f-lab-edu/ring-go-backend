name: Deploy to MVP Development Server
on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development  # GitHub Environment 보호

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ringgo:dev-${{ github.sha }}

      - name: Deploy to Development Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_SERVER_IP }}
          username: ${{ secrets.AWS_SERVER_USERNAME }}
          key: ${{ secrets.AWS_SERVER_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting MVP development deployment..."
            echo "📦 Deploying commit: ${{ github.sha }}"
            
            # 최신 이미지 pull
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ringgo:dev-${{ github.sha }}
            
            # 기존 컨테이너 백업 및 정리
            if docker ps | grep -q ringgo; then
              echo "📦 Creating backup of current container..."
              docker commit ringgo ${{ secrets.DOCKERHUB_USERNAME }}/ringgo:backup-$(date +%Y%m%d-%H%M%S)
            fi
            
            docker stop ringgo || true
            docker rm ringgo || true
            
            # MVP 개발용 컨테이너 시작 (개발 최적화 설정)
            docker run -d --name ringgo \
              --restart unless-stopped \
              --memory=400m \
              --cpus=0.8 \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=dev \
              -e SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
              -e SPRING_DATA_REDIS_HOST="${{ secrets.SPRING_DATA_REDIS_HOST }}" \
              -e SPRING_DATA_REDIS_PORT="${{ secrets.SPRING_DATA_REDIS_PORT }}" \
              -e SPRING_KAFKA_BOOTSTRAP_SERVERS="${{ secrets.SPRING_KAFKA_BOOTSTRAP_SERVERS }}" \
              -e SPRING_KAFKA_CONSUMER_GROUP_ID="${{ secrets.SPRING_KAFKA_CONSUMER_GROUP_ID }}" \
              -e SERVER_BASE_URL="${{ secrets.SERVER_BASE_URL }}" \
              -e SWAGGER_DESCRIPTION="${{ secrets.SWAGGER_DESCRIPTION }}" \
              -e OAUTH_KAKAO_CLIENT_ID="${{ secrets.OAUTH_KAKAO_CLIENT_ID }}" \
              -e OAUTH_KAKAO_CLIENT_SECRET="${{ secrets.OAUTH_KAKAO_CLIENT_SECRET }}" \
              -e OAUTH_NAVER_CLIENT_ID="${{ secrets.OAUTH_NAVER_CLIENT_ID }}" \
              -e OAUTH_NAVER_CLIENT_SECRET="${{ secrets.OAUTH_NAVER_CLIENT_SECRET }}" \
              -e OAUTH_GOOGLE_CLIENT_ID="${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}" \
              -e OAUTH_GOOGLE_CLIENT_SECRET="${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
              -e SPRING_JPA_SHOW_SQL=true \
              -e LOG_SQL_LEVEL=DEBUG \
              -e LOG_SPRING_SECURITY_LEVEL=INFO \
              ${{ secrets.DOCKERHUB_USERNAME }}/ringgo:dev-${{ github.sha }}
            
            echo "⏳ Waiting for MVP application to start..."
            sleep 30
            
            # 컨테이너 상태 확인
            if ! docker ps | grep ringgo; then
              echo "❌ Container not running!"
              echo "📋 Container logs:"
              docker logs ringgo --tail 30
              exit 1
            fi
            
            echo "✅ Container is running"
            
            # MVP 개발용 상세 헬스체크
            echo "🔍 Checking MVP application health..."
            for i in {1..8}; do
              # 우선순위 1: Actuator Health 엔드포인트
              if curl -f -s http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "✅ Actuator health endpoint responding!"
            
                # Health 상태 세부 확인
                HEALTH_STATUS=$(curl -s http://localhost:8080/actuator/health | grep -o '"status":"[^"]*' | cut -d'"' -f4)
                if [ "$HEALTH_STATUS" = "UP" ]; then
                  echo "✅ Application health status: UP"
                else
                  echo "⚠️  Application health status: $HEALTH_STATUS"
                fi
                break
            
              # 우선순위 2: Swagger UI 엔드포인트 (yml 설정에 맞춤)
              elif curl -f -s http://localhost:8080/docs >/dev/null 2>&1; then
                echo "✅ Swagger UI responding at /docs"
                break
            
              # 우선순위 3: 개발용 API 엔드포인트
              elif curl -f -s http://localhost:8080/v1/health >/dev/null 2>&1; then
                echo "✅ Development API responding!"
                break
            
              # 우선순위 4: 루트 엔드포인트
              elif curl -f -s http://localhost:8080/ >/dev/null 2>&1; then
                echo "✅ Root endpoint responding"
                break
            
              elif [ $i -eq 8 ]; then
                echo "❌ MVP application not responding after 8 attempts!"
                echo "📋 Application logs:"
                docker logs ringgo --tail 50
                echo "📊 Container stats:"
                docker stats ringgo --no-stream
                exit 1
              fi
              echo "🔄 Health check attempt $i/8 failed, retrying in 15 seconds..."
              sleep 15
            done
            
            echo "🎉 MVP Development deployment completed successfully!"
            echo "📱 Application URL: http://${{ secrets.AWS_SERVER_IP }}:8080"
            echo "📋 Swagger UI: http://${{ secrets.AWS_SERVER_IP }}:8080/docs"
            echo "🔧 Health Check: http://${{ secrets.AWS_SERVER_IP }}:8080/actuator/health"
            echo "⚙️  Development API: http://${{ secrets.AWS_SERVER_IP }}:8080/v1/health"
            echo "🧪 Config Test: http://${{ secrets.AWS_SERVER_IP }}:8080/v1/dev/config/summary"
            
            # 최종 상태 출력
            echo "📊 Final container status:"
            docker ps | grep ringgo
            docker stats ringgo --no-stream
            
            # 이전 이미지 정리 (디스크 절약)
            echo "🧹 Cleaning up old images..."
            docker image prune -f --filter "until=72h"
